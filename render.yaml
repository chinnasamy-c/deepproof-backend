services:
  - type: web
    name: deepproof
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MAX_FILE_MB
        value: "15"
      - key: MAX_BATCH_FILES
        value: "25"
